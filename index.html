<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10201e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TELSİZ">
  <meta name="description" content="Aynı kanala gir, basılı tut ve konuş.">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>TELSİZ — Bas konuş</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="TELSİZ ana sayfa">
        <span class="brand-mark" aria-hidden="true">◉</span>
        <span><strong>TELSİZ</strong><small>GENEL KANAL</small></span>
      </a>
      <span id="connectionStatus" class="connection-status">HAZIR</span>
    </header>

    <div id="talkToast" class="talk-toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <section id="joinPanel" class="card join-card">
      <div class="radio-icon" aria-hidden="true">📻</div>
      <p class="eyebrow">TEK KANAL · HERKES KATILABİLİR</p>
      <h1>Katıl.<br><span>Bas, konuş.</span></h1>
      <p class="intro">Adını yaz, kanala gir. Ekipteki herkes aynı bağlantıyı kullanır. iPhone’da ekran açıkken canlı konuşma daha kararlı çalışır.</p>
      <label for="nameInput">Adın</label>
      <input id="nameInput" maxlength="24" autocomplete="nickname" placeholder="Örn. Ece" enterkeyhint="go">
      <button id="joinButton" class="join-button" type="button">KANALA KATIL <span aria-hidden="true">→</span></button>
      <p id="joinMessage" class="message" role="status" aria-live="polite"></p>
      <p id="micMessage" class="notification-message" role="status" aria-live="polite"></p>
      <button id="notificationButton" class="notification-button" type="button">BİLDİRİMLERİ AÇ</button>
      <p id="notificationMessage" class="notification-message" role="status" aria-live="polite"></p>
    </section>

    <section id="radioPanel" class="card radio-card hidden" aria-label="Genel telsiz kanalı">
      <div class="channel-heading">
        <div><p class="eyebrow">ŞU AN</p><h1>GENEL KANAL</h1></div>
        <span id="peopleCount" class="people-count">1/10</span>
      </div>

      <div id="speakerBanner" class="speaker-banner hidden" role="status">
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="speakerName"></span>
      </div>

      <div class="people-heading"><span>KANALDAKİLER</span><span>CANLI</span></div>
      <ul id="peopleList" class="people-list"></ul>

      <div class="talk-zone">
        <button id="talkButton" class="talk-button" type="button" aria-pressed="false" disabled>
          <span class="mic-icon" aria-hidden="true">🎙</span>
          <strong id="talkLabel">BASILI TUT, KONUŞ</strong>
          <small>Açılış ve bırakma bipleri karşıya gider</small>
        </button>
      </div>

      <button id="enableAudioButton" class="audio-button hidden" type="button">Sesi aç</button>
      <p id="radioMessage" class="message" role="status" aria-live="polite"></p>
      <button id="leaveButton" class="leave-button" type="button">Kanaldan çık</button>
      <div id="audioElements" class="audio-elements" aria-hidden="true"></div>
    </section>

    <footer>
      <span>Ses kaydı alınmaz.</span>
      <span>Mikrofon izni gerekir.</span>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
