name: Validate TELSIZ
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate syntax, PWA files, and build
        run: node --check app.js && npm run test:static && npm run build && npm run test:build
      - name: Run Firestore Rules tests in the Emulator
        run: npm run test:rules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install and test Firebase Functions
        run: pnpm --dir functions install --frozen-lockfile && pnpm --dir functions test
