name: Telsiz
options:
  bundleIdPrefix: com.bilalze96
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.bilalze96.telsiz
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_ENTITLEMENTS: Telsiz/Telsiz.entitlements
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: TELSİZ
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 154.0.0
targets:
  Telsiz:
    type: application
    platform: iOS
    sources:
      - path: Telsiz
        excludes:
          - GoogleService-Info.plist
          - Telsiz.entitlements
    resources:
      - path: Telsiz/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseFirestore
      - package: WebRTC
        product: WebRTC
    info:
      properties:
        NSMicrophoneUsageDescription: TELSİZ bas konuş iletimi için mikrofonu kullanır.
        UIBackgroundModes:
          - push-to-talk
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
